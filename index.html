<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATH RUSH — 微分砲弾プロトタイプ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d21;color:#f3f5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:580px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:19px;color:#ffe08b}.tag{font-size:11px;color:#9aaed5}.hud{display:flex;justify-content:space-between;font-size:13px}.hud strong{color:#f5ce76}.arena{height:36dvh;min-height:220px;max-height:390px;position:relative;border:1px solid #40517b;border-radius:15px;overflow:hidden;background:linear-gradient(#111a39,#172348)}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.lane{border-right:1px dashed #445174;position:relative}.lane:last-child{border:0}.lane.active{background:#436ca31c}.lane small{position:absolute;top:7px;left:0;right:0;text-align:center;color:#7489ad}.enemy{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:33px;filter:drop-shadow(0 3px 5px #000);text-align:center}.enemy small{display:block;font-size:10px;color:#fff;white-space:nowrap}.hero{position:absolute;bottom:5px;width:33.33%;text-align:center;font-size:27px;transition:left .15s}.hero small{display:block;font-size:10px;color:#b9dcff}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.controls button,.ammo button,.answers button,.reset{border:1px solid #566b9b;border-radius:11px;background:#1c2b51;color:#fff;padding:10px 5px;font-weight:700}.controls button.selected{border-color:#72cbff;background:#235080}.controls button.fire{background:#177a49;border-color:#6cffac;color:white}.ammo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ammo button{min-height:49px;padding:5px 7px;border-radius:9px}.ammo small{margin-bottom:1px!important}.ammo .formula{font-size:clamp(12px,3.3vw,17px)}.ammo .left{border-color:#3dba94}.ammo .right{border-color:#f3a34e}.ammo small{display:block;font-size:11px;color:#aebddd;margin-bottom:4px}.formula{font-size:clamp(13px,3.8vw,20px);overflow-wrap:anywhere}.cannon{border:2px solid #7c88bd;border-radius:18px;background:linear-gradient(145deg,#1c2750,#101c37);padding:6px 9px;text-align:center;min-height:54px}.cannon.ready{border-color:#4af1a2;box-shadow:0 0 15px #2bbd6738}.cannon .expr{font-size:clamp(15px,4.3vw,22px);font-weight:750;margin:2px 0}.cannon small{color:#a7b9df;font-size:10px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.answers button{min-height:53px;font-size:clamp(12px,3.5vw,18px);position:relative;overflow-wrap:anywhere}.answers button.wrong{opacity:.45}.answers button.wrong:after{content:'❌';position:absolute;inset:0;display:grid;place-items:center;font-size:30px}.answers button:disabled{cursor:default}.hint{font-size:12px;text-align:center;color:#9faed2;min-height:18px}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center}.bottom select{background:#192849;color:#fff;padding:8px;border-radius:8px;border:1px solid #526791}.reset{font-size:12px;padding:8px 12px}.flash{animation:flash .25s}@keyframes flash{50%{background:#9a1c39}}.shot{position:absolute;width:13px;height:13px;background:#5af8a9;border-radius:50%;box-shadow:0 0 14px #5af8a9;z-index:5;transition:top .2s linear}.info{font-size:11px;color:#94a7cd;text-align:center}
 .flying-formula{position:fixed;z-index:1000;pointer-events:none;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 0 12px #77dbff;transform-origin:center;will-change:transform,opacity}.ammo button:disabled{opacity:.65} </style></head><body><main><div class="top"><div><b>⚡ MATH RUSH</b><div class="tag">微分砲弾 · 操作感プロトタイプ v0.2</div></div><button class="reset" onclick="reset()">やり直す</button></div><div class="hud"><span>♥ HP <strong id="hp">100</strong></span><span>撃破 <strong id="kills">0</strong></span><span>初回正解 <strong id="accuracy">0/0</strong></span></div><div class="arena" id="arena"><div class="lanes"><div class="lane" id="lane0"><small>LEFT</small></div><div class="lane" id="lane1"><small>CENTER</small></div><div class="lane" id="lane2"><small>RIGHT</small></div></div><div class="hero" id="hero">🚀<small>プレイヤー</small></div></div><div class="controls" id="controls"><button onclick="control(0)">◀ LEFT</button><button onclick="control(1)">● CENTER</button><button onclick="control(2)">RIGHT ▶</button></div><div class="ammo"><button class="left" id="leftAmmo" onclick="load('left')"></button><button class="right" id="rightAmmo" onclick="load('right')"></button></div><div class="cannon" id="cannon" onclick="openQuestion()"><small id="cannonLabel">砲弾：左右の弾薬庫から装填</small><div class="expr" id="cannonExpr">d/dx (　　)</div></div><div class="answers" id="answers"><button disabled>—</button><button disabled>—</button><button disabled>—</button><button disabled>—</button></div><div class="hint" id="hint">左は易しめ、右は難しめ。装填した砲弾をタップして解答！</div><div class="bottom"><span class="tag">難易度</span><select id="difficulty" onchange="reset()"><option value="easy">EASY 自動発射</option><option value="normal" selected>NORMAL 手動発射</option><option value="hard">HARD 手動発射</option></select></div><div class="info">試作：多項式の微分のみ。モンスターはリアルタイム接近。到達時、同じレーンならダメージ。</div></main><script>
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let animationToken=0;let lane=1,hp=100,kills=0,first=0,solved=0,ammo={},shell=null,phase='empty',enemies=[],eid=0,last=0,spawnClock=0,active=true,run=0;
function poly(terms){let s='';for(let [c,n] of terms){if(!c)continue;let t=(Math.abs(c)===1&&n>0?'':Math.abs(c))+(n?'x'+(n>1?'<sup>'+n+'</sup>':''):'');s+=(s?(c<0?' − ':' + '):(c<0?'−':''))+t}return s||'0'}
function question(side){let hard=side==='right';let count=hard?rand(2,4):rand(1,2),used=new Set(),terms=[];for(let i=0;i<count;i++){let n=rand(hard?2:0,hard?9:4);while(used.has(n))n=rand(hard?2:0,hard?9:4);used.add(n);let c=rand(1,hard?8:5)*(Math.random()<.3?-1:1);terms.push([c,n])}terms.sort((a,b)=>b[1]-a[1]);let deriv=terms.map(([c,n])=>[c*n,n-1]).filter(([c])=>c);let answer=poly(deriv),wrongs=new Set();wrongs.add(poly(terms));wrongs.add(poly(terms.map(([c,n])=>[c,n-1]).filter(([c,n])=>n>=0)));wrongs.add(poly(terms.map(([c,n])=>[c*(n+1),n-1]).filter(([c,n])=>c&&n>=0)));let i=0;while(wrongs.size<3||wrongs.has(answer)){let alt=deriv.length?deriv.map(([c,n],j)=>[j?c:c+(++i),n]):[[++i,0]];wrongs.add(poly(alt));wrongs.delete(answer)}let options=[answer,...[...wrongs].slice(0,3)];for(let k=3;k>0;k--){let j=rand(0,k);[options[k],options[j]]=[options[j],options[k]]}return {expr:poly(terms),answer,options,power:hard?150:75,wrong:new Set(),tried:false}}
function renderAmmo(){for(let side of ['left','right'])$(side+'Ammo').innerHTML='<small>'+(side==='left'?'🟢 左：軽い弾':'🟠 右：重い弾')+'</small><span class="formula">'+ammo[side].expr+'</span>'}
function flyFormula(from,html,target,done){
  const a=from.getBoundingClientRect(),b=target.getBoundingClientRect();
  const node=document.createElement('div');node.className='flying-formula';node.innerHTML=html;
  node.style.left=(a.left+a.width/2)+'px';node.style.top=(a.top+a.height/2)+'px';
  node.style.transform='translate(-50%,-50%) scale(1)';
  document.body.appendChild(node);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  const animation=node.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.13)`,opacity:.2}],{duration:330,easing:'cubic-bezier(.2,.7,.2,1)'});
  animation.onfinish=()=>{node.remove();if(done)done()};
}
function load(side){
 if(!active||phase!=='empty')return;
 const source=$(side+'Ammo'),text=source.querySelector('.formula').innerHTML;
 shell=ammo[side];ammo[side]=question(side);phase='question';
 renderAmmo();renderShell();renderAnswers();
 flyFormula(source,text,$('cannon'));
 $('hint').textContent='装填完了！ 4択から導関数を選ぼう';
}
function openQuestion(){if(!active||phase!=='loaded')return;phase='question';renderShell();renderAnswers()}
function renderShell(){$('cannon').classList.toggle('ready',phase==='ready');$('cannonLabel').textContent=phase==='empty'?'砲弾：左右の弾薬庫から装填':phase==='loaded'?'砲弾をタップして計算開始':phase==='question'?'正解の式に変換しよう':'✨ 砲弾完成 · '+shell.power+' POWER';$('cannonExpr').innerHTML=phase==='empty'?'d/dx (　　)':phase==='ready'?shell.answer:'<span style="color:#9ad8ff">d/dx</span> ('+shell.expr+')';renderControls()}
function renderControls(){let easy=$('difficulty').value==='easy';[...$('controls').children].forEach((b,i)=>{b.classList.toggle('selected',i===lane);b.classList.toggle('fire',phase==='ready'&&!easy);b.innerHTML=phase==='ready'&&!easy?'🚀 発射 '+['左','中','右'][i]:['◀ LEFT','● CENTER','RIGHT ▶'][i]})}
function renderAnswers(){$('answers').innerHTML=phase==='question'?shell.options.map((o,i)=>'<button '+(shell.wrong.has(i)?'disabled class="wrong"':'')+' data-i="'+i+'">'+o+'</button>').join(''):'<button disabled>—</button>'.repeat(4);$('answers').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){if(!active||phase!=='question'||shell.wrong.has(i))return;let value=shell.options[i];if(!shell.tried){solved++;if(value===shell.answer)first++;shell.tried=true}if(value!==shell.answer){shell.wrong.add(i);hp=Math.max(0,hp-($('difficulty').value==='easy'?0:$('difficulty').value==='hard'?15:8));$('arena').classList.remove('flash');void $('arena').offsetWidth;$('arena').classList.add('flash');$('hint').textContent='❌ 同じ問題を考え直そう';updateHud();renderAnswers();if(hp===0)gameOver();return}phase='charging';renderControls();const source=$('answers').querySelector('[data-i="'+i+'"]');
 const token=animationToken;
 $('hint').textContent='✨ 正解の式を砲弾へ変換中…';
 flyFormula(source,shell.answer,$('cannon'),()=>{
   if(token!==animationToken||!active)return;
   phase='ready';renderShell();renderAnswers();
   $('hint').textContent='正解！ '+shell.power+' POWER の砲弾が完成';
   if($('difficulty').value==='easy')fireNearest();
 });}
function control(i){if(!active)return;if(phase==='ready'&&$('difficulty').value!=='easy'){lane=i;fire(i)}else{lane=i;renderControls();renderEnemies()}}
function fireNearest(){let e=[...enemies].sort((a,b)=>b.progress-a.progress)[0];if(e){lane=e.lane;fire(lane)}else{phase='empty';shell=null;renderShell();$('hint').textContent='敵がいないため砲弾を消費。次を装填しよう'}}
function fire(i){if(phase!=='ready'||!active)return;let targets=enemies.filter(e=>e.lane===i).sort((a,b)=>b.progress-a.progress),e=targets[0];if(e){e.hp-=shell.power;if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);kills++}$('hint').textContent=e.hp<=0?'🎯 撃破！':'🎯 命中！ 残りHP '+e.hp}else $('hint').textContent='砲弾は空のレーンを通過した';phase='empty';shell=null;renderShell();renderEnemies();updateHud()}
function updateHud(){$('hp').textContent=hp;$('kills').textContent=kills;$('accuracy').textContent=first+'/'+solved}
function spawn(){if(enemies.length>=5)return;let l=rand(0,2),type=rand(0,4),icons=['🟢','🦇','👺','👻','🐉'],health=[75,100,150,200,300];enemies.push({id:++eid,lane:l,icon:icons[type],hp:health[type],progress:0})}
function renderEnemies(){for(let i=0;i<3;i++)$('lane'+i).classList.toggle('active',lane===i);$('hero').style.left=lane*100/3+'%';document.querySelectorAll('.enemy').forEach(x=>x.remove());let arena=$('arena');for(let e of enemies){let node=document.createElement('div');node.className='enemy';node.style.left=(e.lane+.5)*100/3+'%';node.style.top=(8+e.progress*76)+'%';node.innerHTML=e.icon+'<small>HP '+e.hp+'</small>';arena.appendChild(node)}}
function gameOver(){active=false;$('hint').textContent='GAME OVER · やり直すボタンで再挑戦';renderControls()}
function tick(now,token){if(token!==run||!active)return;let dt=Math.min((now-last)||0,100);last=now;spawnClock+=dt;let diff=$('difficulty').value,rate=diff==='easy'?.000004:diff==='hard'?.000016:.000010;if(spawnClock>(diff==='easy'?8500:diff==='hard'?4300:6000)){spawnClock=0;spawn()}for(let e of [...enemies]){e.progress+=dt*rate;if(e.progress>=1){if(e.lane===lane){hp=Math.max(0,hp-(diff==='easy'?10:diff==='hard'?25:15));$('hint').textContent='💥 モンスターが砲台に衝突！';updateHud()}enemies.splice(enemies.indexOf(e),1);if(hp===0)gameOver()}}renderEnemies();requestAnimationFrame(t=>tick(t,token))}
function reset(){run++;animationToken++;document.querySelectorAll('.flying-formula').forEach(n=>n.remove());active=true;hp=100;kills=0;first=0;solved=0;lane=1;enemies=[];eid=0;last=0;spawnClock=0;phase='empty';shell=null;ammo={left:question('left'),right:question('right')};renderAmmo();renderShell();renderAnswers();updateHud();$('hint').textContent='左・右の問題を選んで砲弾へ装填';spawn();renderEnemies();requestAnimationFrame(t=>tick(t,run))}
reset();
</script></body></html>
