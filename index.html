<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATH RUSH — 微分砲弾プロトタイプ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d21;color:#f3f5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:580px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:19px;color:#ffe08b}.tag{font-size:11px;color:#9aaed5}.hud{display:flex;justify-content:space-between;font-size:13px}.hud strong{color:#f5ce76}.arena{height:51dvh;min-height:290px;max-height:520px;position:relative;border:1px solid #40517b;border-radius:15px;overflow:hidden;background:linear-gradient(#111a39,#172348)}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.lane{border-right:1px dashed #445174;position:relative}.lane:last-child{border:0}.lane.active{background:#436ca31c}.lane small{position:absolute;top:7px;left:0;right:0;text-align:center;color:#7489ad}.enemy{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:33px;filter:drop-shadow(0 3px 5px #000);text-align:center}.enemy small{display:block;font-size:10px;color:#fff;white-space:nowrap}.hero{position:absolute;bottom:5px;width:33.33%;text-align:center;transition:left .15s;z-index:4;display:flex;justify-content:center}.hero .cannon{width:94%;min-height:59px;padding:4px 3px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}.hero .cannon .expr{font-size:clamp(10px,2.9vw,16px);line-height:1.18;max-width:100%;overflow-wrap:anywhere}.hero .cannon small{font-size:9px}.hero .cannon:before{content:"▲";position:absolute;top:-17px;color:#b8d6ff;font-size:22px;text-shadow:0 0 7px #7bcfff}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.controls button,.ammo button,.answers button,.reset{border:1px solid #566b9b;border-radius:11px;background:#1c2b51;color:#fff;padding:10px 5px;font-weight:700}.controls button.selected{border-color:#72cbff;background:#235080}.controls button.fire{background:#177a49;border-color:#6cffac;color:white}.ammo{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ammo.hidden{display:none}.ammo button{height:34px;min-height:34px;padding:2px 5px;border-radius:7px;line-height:1.1}.ammo small{margin-bottom:1px!important}.ammo .formula{font-size:clamp(11px,3.1vw,16px)}.ammo .left{border-color:#3dba94}.ammo .right{border-color:#f3a34e}.ammo small{display:block;font-size:11px;color:#aebddd;margin-bottom:4px}.formula{font-size:clamp(13px,3.8vw,20px);overflow-wrap:anywhere}.cannon{border:2px solid #7c88bd;border-radius:18px;background:linear-gradient(145deg,#1c2750,#101c37);padding:6px 9px;text-align:center;min-height:54px}.cannon.ready{border-color:#4af1a2;box-shadow:0 0 15px #2bbd6738}.cannon .expr{font-size:clamp(15px,4.3vw,22px);font-weight:750;margin:2px 0}.cannon small{color:#a7b9df;font-size:10px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.answers button{min-height:53px;font-size:clamp(12px,3.5vw,18px);position:relative;overflow-wrap:anywhere}.answers button.wrong{opacity:.45}.answers button.wrong:after{content:'❌';position:absolute;inset:0;display:grid;place-items:center;font-size:30px}.answers button:disabled{cursor:default}.hint{font-size:12px;text-align:center;color:#9faed2;min-height:18px}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center}.bottom select{background:#192849;color:#fff;padding:8px;border-radius:8px;border:1px solid #526791}.reset{font-size:12px;padding:8px 12px}.flash{animation:flash .25s}@keyframes flash{50%{background:#9a1c39}}.shot{position:absolute;width:13px;height:13px;background:#5af8a9;border-radius:50%;box-shadow:0 0 14px #5af8a9;z-index:5;transition:top .2s linear}.info{font-size:11px;color:#94a7cd;text-align:center}
 .flying-formula{position:fixed;z-index:1000;pointer-events:none;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 0 12px #77dbff;transform-origin:center;will-change:transform,opacity}.ammo button:disabled{opacity:.65}.flying-formula{display:flex;align-items:center;justify-content:center;padding:5px 10px;border:2px solid #88cfff;border-radius:10px;background:linear-gradient(135deg,#2a4575,#1b294d);box-shadow:0 5px 22px #0009,0 0 16px #55b9ff55;font-size:clamp(12px,3.5vw,19px);text-shadow:none;overflow:hidden}.flying-formula.from-left{border-color:#3dba94}.flying-formula.from-right{border-color:#f3a34e}.blast{position:absolute;z-index:12;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff6b8 0%,#ff9b32 25%,#ff5b19 48%,#ff5b1900 72%);transform:translate(-50%,-50%);animation:blast .44s ease-out forwards}.muzzle{position:absolute;z-index:11;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffd05e 26%,#ff7b2200 75%);transform:translate(-50%,-50%);animation:blast .24s ease-out forwards}@keyframes blast{from{width:9px;height:9px;opacity:1}to{width:100px;height:100px;opacity:0}}.projectile{position:absolute;z-index:10;width:17px;height:17px;border-radius:50%;background:#ffeeb0;box-shadow:0 0 10px 4px #ffae47,0 0 25px 8px #ff5b1b;pointer-events:none;transform:translate(-50%,-50%)}  
.hero{bottom:85px!important;font-size:30px!important;pointer-events:none}
.problem-panel{position:absolute;bottom:7px;left:8px;right:8px;width:auto;min-height:69px;z-index:6;display:flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:13px;background:linear-gradient(135deg,#263967,#121e3f);box-shadow:0 3px 15px #0009}
.problem-panel .expr{font-size:clamp(19px,5.2vw,28px);font-weight:750;line-height:1.2;white-space:normal;overflow-wrap:anywhere}
.problem-panel .operator{color:#9bdcff}
.problem-panel .blank{display:inline-block;min-width:43vw;max-width:230px;height:31px;border:2px dashed #7194c5;border-radius:7px;vertical-align:middle;color:transparent;background:#12213d}
.problem-panel .filled{color:#fff}
.problem-panel .finished{color:#8dffc3}
.choice-area{min-height:123px;display:flex;flex-direction:column;justify-content:stretch}
.choice-area .ammo,.choice-area .answers{flex:1}
.ammo button{height:auto!important;min-height:105px!important;padding:12px!important;border-radius:11px!important}
.ammo .formula{font-size:clamp(16px,4.1vw,22px)!important}
.answers button{min-height:53px}
</style></head><body><main><div class="top"><div><b>⚡ MATH RUSH</b><div class="tag">微分砲弾 · 操作感プロトタイプ v0.5</div></div><button class="reset" onclick="reset()">やり直す</button></div><div class="hud"><span>♥ HP <strong id="hp">100</strong></span><span>撃破 <strong id="kills">0</strong></span><span>初回正解 <strong id="accuracy">0/0</strong></span></div><div class="arena" id="arena"><div class="lanes"><div class="lane" id="lane0"><small>LEFT</small></div><div class="lane" id="lane1"><small>CENTER</small></div><div class="lane" id="lane2"><small>RIGHT</small></div></div><div class="hero" id="hero">🚀</div><div class="cannon problem-panel" id="cannon"><div class="expr" id="cannonExpr"><span class="operator">d/dx</span> (<span class="blank" id="blank">　　　　　</span>)</div></div></div><div class="controls" id="controls"><button onclick="control(0)">◀ LEFT</button><button onclick="control(1)">● CENTER</button><button onclick="control(2)">RIGHT ▶</button></div><div class="choice-area"><div class="ammo" id="ammoArea"><button class="left" id="leftAmmo" onclick="load('left')"></button><button class="right" id="rightAmmo" onclick="load('right')"></button></div><div class="answers" id="answers"><button disabled>—</button><button disabled>—</button><button disabled>—</button><button disabled>—</button></div></div><div class="hint" id="hint">左は易しめ、右は難しめ。問題を選ぶと4択が現れる</div><div class="bottom"><span class="tag">難易度</span><select id="difficulty" onchange="reset()"><option value="easy">EASY 自動発射</option><option value="normal" selected>NORMAL 手動発射</option><option value="hard">HARD 手動発射</option></select></div><div class="info">試作：多項式の微分のみ。モンスターはリアルタイム接近。到達時、同じレーンならダメージ。</div></main><script>
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let animationToken=0;let lane=1,hp=100,kills=0,first=0,solved=0,ammo={},shell=null,phase='empty',enemies=[],eid=0,last=0,spawnClock=0,active=true,run=0;
function poly(terms){let s='';for(let [c,n] of terms){if(!c)continue;let t=(Math.abs(c)===1&&n>0?'':Math.abs(c))+(n?'x'+(n>1?'<sup>'+n+'</sup>':''):'');s+=(s?(c<0?' − ':' + '):(c<0?'−':''))+t}return s||'0'}
function question(side){let hard=side==='right';let count=hard?rand(2,4):rand(1,2),used=new Set(),terms=[];for(let i=0;i<count;i++){let n=rand(hard?2:0,hard?9:4);while(used.has(n))n=rand(hard?2:0,hard?9:4);used.add(n);let c=rand(1,hard?8:5)*(Math.random()<.3?-1:1);terms.push([c,n])}terms.sort((a,b)=>b[1]-a[1]);let deriv=terms.map(([c,n])=>[c*n,n-1]).filter(([c])=>c);let answer=poly(deriv),wrongs=new Set();wrongs.add(poly(terms));wrongs.add(poly(terms.map(([c,n])=>[c,n-1]).filter(([c,n])=>n>=0)));wrongs.add(poly(terms.map(([c,n])=>[c*(n+1),n-1]).filter(([c,n])=>c&&n>=0)));let i=0;while(wrongs.size<3||wrongs.has(answer)){let alt=deriv.length?deriv.map(([c,n],j)=>[j?c:c+(++i),n]):[[++i,0]];wrongs.add(poly(alt));wrongs.delete(answer)}let options=[answer,...[...wrongs].slice(0,3)];for(let k=3;k>0;k--){let j=rand(0,k);[options[k],options[j]]=[options[j],options[k]]}return {expr:poly(terms),answer,options,power:hard?150:75,wrong:new Set(),tried:false}}
function renderAmmo(){$('ammoArea').classList.toggle('hidden',phase!=='empty');for(let side of ['left','right'])$(side+'Ammo').innerHTML='<span class="formula">'+ammo[side].expr+'</span>'}
function flyFormula(from,html,target,done){
  const a=from.getBoundingClientRect(),b=target.getBoundingClientRect();
  const node=document.createElement('div');node.className='flying-formula';
  if(from.id==='leftAmmo')node.classList.add('from-left');
  if(from.id==='rightAmmo')node.classList.add('from-right');
  node.innerHTML=html;node.style.left=a.left+'px';node.style.top=a.top+'px';
  node.style.width=a.width+'px';node.style.height=a.height+'px';
  document.body.appendChild(node);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  const animation=node.animate([
    {transform:'translate(0,0) scale(1)',opacity:1,offset:0},
    {transform:`translate(${dx*.42}px,${dy*.42}px) scale(.88)`,opacity:1,offset:.5},
    {transform:`translate(${dx}px,${dy}px) scale(.48)`,opacity:.85,offset:1}
  ],{duration:750,easing:'cubic-bezier(.24,.65,.27,1)'});
  animation.onfinish=()=>{node.remove();if(done)done()};
}
function fireEffect(i,progress,hit){
 const arena=$('arena'),w=arena.clientWidth,h=arena.clientHeight,x=(i+.5)*w/3;
 const y0=h-90,y1=hit?(8+progress*76)*h/100:-18;
 const flash=document.createElement('div');flash.className='muzzle';flash.style.left=x+'px';flash.style.top=y0+'px';arena.appendChild(flash);setTimeout(()=>flash.remove(),280);
 const ball=document.createElement('div');ball.className='projectile';ball.style.left=x+'px';ball.style.top=y0+'px';arena.appendChild(ball);
 const anim=ball.animate([{top:y0+'px',opacity:1},{top:y1+'px',opacity:1}],{duration:Math.max(190,Math.abs(y0-y1)*1.15),easing:'linear'});
 anim.onfinish=()=>{ball.remove();if(hit){const blast=document.createElement('div');blast.className='blast';blast.style.left=x+'px';blast.style.top=y1+'px';arena.appendChild(blast);setTimeout(()=>blast.remove(),470)}};
}
function load(side){
 if(!active||phase!=='empty')return;
 const source=$(side+'Ammo'),text=source.querySelector('.formula').innerHTML;
 shell=ammo[side];ammo[side]=question(side);phase='loading';
 const token=animationToken;
 renderShell();renderAnswers();
 flyFormula(source,text,$('blank'),()=>{
   if(token!==animationToken||!active)return;
   phase='question';renderShell();renderAnswers();
   $('hint').textContent='導関数を4択から選ぼう';
 });
 $('ammoArea').classList.add('hidden');
 $('hint').textContent='式を問題欄へ装填中…';
}
function openQuestion(){if(!active||phase!=='loaded')return;phase='question';renderShell();renderAnswers()}
function renderShell(){
 $('cannon').classList.toggle('ready',phase==='ready');
 const content=phase==='empty'||phase==='loading'
  ?'<span class="operator">d/dx</span> (<span class="blank" id="blank">　　　　　</span>)'
  :phase==='ready'
   ?'<span class="finished">'+shell.answer+'</span>'
   :'<span class="operator">d/dx</span> (<span class="filled">'+shell.expr+'</span>)';
 $('cannonExpr').innerHTML=content;renderControls();
}
function renderControls(){let easy=$('difficulty').value==='easy';[...$('controls').children].forEach((b,i)=>{b.classList.toggle('selected',i===lane);b.classList.toggle('fire',phase==='ready'&&!easy);b.innerHTML=phase==='ready'&&!easy?'🚀 発射 '+['左','中','右'][i]:['◀ LEFT','● CENTER','RIGHT ▶'][i]})}
function renderAnswers(){$('answers').style.display=phase==='question'?'grid':'none';$('answers').innerHTML=phase==='question'?shell.options.map((o,i)=>'<button '+(shell.wrong.has(i)?'disabled class="wrong"':'')+' data-i="'+i+'">'+o+'</button>').join(''):'';$('answers').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){if(!active||phase!=='question'||shell.wrong.has(i))return;let value=shell.options[i];if(!shell.tried){solved++;if(value===shell.answer)first++;shell.tried=true}if(value!==shell.answer){shell.wrong.add(i);hp=Math.max(0,hp-($('difficulty').value==='easy'?0:$('difficulty').value==='hard'?15:8));$('arena').classList.remove('flash');void $('arena').offsetWidth;$('arena').classList.add('flash');$('hint').textContent='❌ 同じ問題を考え直そう';updateHud();renderAnswers();if(hp===0)gameOver();return}phase='charging';renderControls();const source=$('answers').querySelector('[data-i="'+i+'"]');
 const token=animationToken;
 $('hint').textContent='✨ 正解の式を砲弾へ変換中…';
 flyFormula(source,shell.answer,$('cannonExpr'),()=>{
   if(token!==animationToken||!active)return;
   phase='ready';renderShell();renderAnswers();
   $('hint').textContent='正解！ '+shell.power+' POWER の砲弾が完成';
   if($('difficulty').value==='easy')fireNearest();
 });}
function control(i){if(!active)return;if(phase==='ready'&&$('difficulty').value!=='easy'){lane=i;fire(i)}else{lane=i;renderControls();renderEnemies()}}
function fireNearest(){let e=[...enemies].sort((a,b)=>b.progress-a.progress)[0];if(e){lane=e.lane;fire(lane)}else{phase='empty';shell=null;renderShell();renderAmmo();renderAnswers();$('hint').textContent='敵がいないため砲弾を消費。次を装填しよう'}}
function fire(i){if(phase!=='ready'||!active)return;let targets=enemies.filter(e=>e.lane===i).sort((a,b)=>b.progress-a.progress),e=targets[0];fireEffect(i,e?e.progress:0,!!e);if(e){e.hp-=shell.power;if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);kills++}$('hint').textContent=e.hp<=0?'🎯 撃破！':'🎯 命中！ 残りHP '+e.hp}else $('hint').textContent='砲弾は空のレーンを通過した';phase='empty';shell=null;renderShell();renderAmmo();renderAnswers();renderEnemies();updateHud()}
function updateHud(){$('hp').textContent=hp;$('kills').textContent=kills;$('accuracy').textContent=first+'/'+solved}
function spawn(){if(enemies.length>=5)return;let l=rand(0,2),type=rand(0,4),icons=['🟢','🦇','👺','👻','🐉'],health=[75,100,150,200,300];enemies.push({id:++eid,lane:l,icon:icons[type],hp:health[type],progress:0})}
function renderEnemies(){for(let i=0;i<3;i++)$('lane'+i).classList.toggle('active',lane===i);$('hero').style.left=lane*100/3+'%';document.querySelectorAll('.enemy').forEach(x=>x.remove());let arena=$('arena');for(let e of enemies){let node=document.createElement('div');node.className='enemy';node.style.left=(e.lane+.5)*100/3+'%';node.style.top=(8+e.progress*76)+'%';node.innerHTML=e.icon+'<small>HP '+e.hp+'</small>';arena.appendChild(node)}}
function gameOver(){active=false;$('hint').textContent='GAME OVER · やり直すボタンで再挑戦';renderControls()}
function tick(now,token){if(token!==run||!active)return;let dt=last?Math.min(now-last,100):0;last=now;spawnClock+=dt;let diff=$('difficulty').value,rate=diff==='easy'?.000004:diff==='hard'?.000016:.000010;if(spawnClock>(diff==='easy'?8500:diff==='hard'?4300:6000)){spawnClock=0;spawn()}for(let e of [...enemies]){e.progress+=dt*rate;if(e.progress>=1){if(e.lane===lane){hp=Math.max(0,hp-(diff==='easy'?10:diff==='hard'?25:15));$('hint').textContent='💥 モンスターが砲台に衝突！';updateHud()}enemies.splice(enemies.indexOf(e),1);if(hp===0)gameOver()}}renderEnemies();requestAnimationFrame(t=>tick(t,token))}
function reset(){run++;animationToken++;document.querySelectorAll('.flying-formula,.projectile,.blast,.muzzle').forEach(n=>n.remove());active=true;hp=100;kills=0;first=0;solved=0;lane=1;enemies=[];eid=0;last=0;spawnClock=0;phase='empty';shell=null;ammo={left:question('left'),right:question('right')};renderAmmo();renderShell();renderAnswers();updateHud();$('hint').textContent='左右どちらかの問題を選ぼう';spawn();renderEnemies();requestAnimationFrame(t=>tick(t,run))}
reset();
</script></body></html>
