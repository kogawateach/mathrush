<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071425"><title>MATH RUSH | CYLINDER CITY</title><style>
*{box-sizing:border-box}body{margin:0;color:#eaf7ff;background:radial-gradient(ellipse at 50% 25%,#1b3855,#081626 58%,#040b14);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed}.app{max-width:500px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}header b{font-size:18px;letter-spacing:2px}header small{display:block;font-size:10px;color:#83aec6;letter-spacing:3px}.tag{font-size:11px;color:#a7d2f0;border:1px solid #3c5b72;border-radius:20px;padding:7px 10px}.intro{margin:5px 0 10px;color:#9ab7ca;font-size:12px;line-height:1.6}.city-view{position:relative;min-height:440px;height:54dvh;max-height:620px;border:1px solid #28465c;border-radius:23px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#15364e 0%,#071421 70%);box-shadow:inset 0 0 60px #0008}.stars{position:absolute;inset:0;background-image:radial-gradient(#a8e4ff99 1px,transparent 1px);background-size:31px 41px;opacity:.12}.tower-viewport{position:absolute;inset:18px 25px 16px;overflow:hidden;touch-action:pan-y;mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent)}.tower{position:absolute;width:78%;left:11%;top:0;will-change:transform;transition:transform .4s cubic-bezier(.2,.8,.2,1)}.floor{height:42px;position:relative;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer}.floor:before{content:"";position:absolute;left:0;right:0;top:8px;bottom:0;border:1px solid #41617c;background:linear-gradient(90deg,#0b2336,#193b50 18%,#0e2438 45%,#1d4357 78%,#102638);border-radius:0 0 22px 22px;box-shadow:inset 0 -7px 10px #0008}.floor:after{content:"";position:absolute;left:0;right:0;top:0;height:17px;border:1px solid #56819b;border-radius:50%;background:linear-gradient(180deg,#355b6e,#142d43 60%,#0d2336)}.floor.completed:before{background:linear-gradient(90deg,#134e46,#176e61 35%,#155b58 75%,#134b4d)}.floor.completed:after{background:linear-gradient(180deg,#50a894,#225c61)}.floor.unlocked:not(.completed):after{border-color:#5baad5;background:linear-gradient(180deg,#37718d,#183b59)}.floor.selected{z-index:2}.floor.selected:before{border:2px solid #6be2ff;box-shadow:0 0 16px #4bcaf788,inset 0 -7px 10px #0008}.floor.selected:after{border:2px solid #8fe8ff;box-shadow:0 0 13px #4bcaf788}.floor-label{z-index:3;position:relative;margin-top:12px;display:flex;gap:9px;align-items:center;font-size:10px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 4px #000}.floor-label span{color:#d7eaff}.floor.selected .floor-label{color:#8eefff}.shaft{position:absolute;z-index:1;left:calc(50% - 7px);top:0;bottom:0;width:14px;background:linear-gradient(90deg,#0b1825,#31536a 45%,#0b1825);box-shadow:0 0 12px #6edaff55;pointer-events:none}.lift{position:absolute;z-index:5;left:calc(50% - 16px);width:32px;height:30px;border:2px solid #9deeff;border-radius:8px;background:#14465a;box-shadow:0 0 14px #6bdfffaa;pointer-events:none;transition:top .55s ease}.lift:before{content:"↕";position:absolute;inset:3px;text-align:center;font-size:16px}.scale{position:absolute;right:8px;top:15px;bottom:15px;display:flex;flex-direction:column;justify-content:space-between;color:#5c879f;font-size:10px}.legend{position:absolute;bottom:12px;left:12px;display:flex;gap:9px;background:#06121cbb;border:1px solid #28475b;border-radius:12px;padding:8px;font-size:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;background:#365468}.dot.ready{background:#5bc9ed}.dot.done{background:#57d5aa}.bottom{margin-top:12px;border:1px solid #2c4a5f;background:#0d2234;border-radius:18px;padding:15px}.eyebrow{font-size:10px;color:#73bcd9;letter-spacing:2px}.headline{font-size:20px;font-weight:800;margin:5px 0}.desc{font-size:12px;color:#a3bbcd;line-height:1.65;min-height:38px}.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{border:0;border-radius:12px;padding:13px;font-weight:800}.primary{flex:1;color:#042436;background:linear-gradient(135deg,#7de9ff,#54c7eb)}.primary:disabled{background:#375366;color:#829aaa}.secondary{background:#1c3a51;color:#cde7f8}.hint{text-align:center;font-size:11px;color:#7195a9;margin:11px 0 15px}.screen{display:none}.screen.active{display:block}.stage-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.stage{min-height:82px;border:1px solid #365a73;border-radius:15px;background:#132d43;color:#e2f7ff;font-weight:800}.stage:disabled{opacity:.38}.stage.done{border-color:#4dbaa0;color:#80e8c4}.stage small{display:block;margin-top:5px;font-size:10px;font-weight:400}.banner{padding:18px;border:1px solid #34566b;border-radius:16px;background:#102c41;margin-top:18px}.banner h2{margin:4px 0 9px}.banner p{color:#acc5d5;line-height:1.7;font-size:13px}.back{background:none;border:0;color:#9cdef9;padding:12px 0}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#19475a;color:white;border:1px solid #5cc4e0;padding:12px 17px;border-radius:12px;max-width:90%;font-size:12px;z-index:30;display:none}.scroll-ctl{position:absolute;top:12px;left:12px;z-index:9;display:flex;flex-direction:column;gap:6px}.scroll-ctl button{background:#112e43d9;color:#b6edff;border:1px solid #39647b;border-radius:9px;width:34px;height:34px}.dev{font-size:10px;color:#7394a8;margin-top:12px;text-align:center}.dev button{background:none;color:#8bd8f6;border:0;text-decoration:underline}
</style></head><body><div class="app"><header><div><small>RESTORATION NETWORK</small><b>⚡ MATH RUSH</b></div><span class="tag" id="status">AI STATUS: MONITORING</span></header><section id="mapScreen" class="screen active"><p class="intro">80階層の円筒都市。階層をタップ、または上下にスワイプして選択。</p><div class="city-view"><div class="stars"></div><div class="scroll-ctl"><button id="up" aria-label="上の階層へ">▲</button><button id="down" aria-label="下の階層へ">▼</button></div><div class="tower-viewport" id="viewport"><div class="tower" id="tower"><div class="shaft"></div><div id="floors"></div><div class="lift" id="lift"></div></div></div><div class="scale"><span>80F</span><span>60F</span><span>40F</span><span>20F</span><span>01F</span></div><div class="legend"><span><i class="dot done"></i>復旧済</span><span><i class="dot ready"></i>移動可能</span><span><i class="dot"></i>未解放</span></div></div><div class="bottom"><div class="eyebrow" id="floorNo">FLOOR 01 / 80</div><div class="headline" id="floorName">第1階層 · はじまりの街</div><div class="desc" id="floorDesc"></div><div class="actions"><button class="secondary" id="goFirst">1Fへ</button><button class="primary" id="enter">街へ移動する</button></div></div><div class="hint">中央エレベーター ｜ 階層を選択して移動</div><div class="dev">試作品：<button id="reset">進行状況をリセット</button></div></section><section id="stageScreen" class="screen"><button class="back" id="back">← 中央エレベーターへ戻る</button><div class="banner"><div class="eyebrow" id="stageFloor">FLOOR 01</div><h2 id="stageTitle">はじまりの街</h2><p id="stageInfo"></p></div><div class="stage-list" id="stages"></div><div class="banner" id="bossPanel"><h2>⚙️ インフラ復旧</h2><p>ステージを進めて、街のインフラを復旧しよう。今回はマップの操作感を確認するためのデモです。</p><button class="primary" id="complete" style="width:100%">デモ：この街の復旧を完了</button></div><p class="hint">※戦闘は未接続。次の段階で既存の3レーン戦闘に接続します。</p></section></div><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='mathrushCylinderPrototype01';let data={completed:[],levels:{}};try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.completed))data=v}catch(e){};let selected=1,current=1;const $=id=>document.getElementById(id),isOpen=n=>n===1||data.completed.includes(1),isDone=n=>data.completed.includes(n),name=n=>n===1?'はじまりの街':`第${n}階層の街`,save=()=>localStorage.setItem(KEY,JSON.stringify(data));const floorHeight=42;let toastTimer;function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2500)}function draw(){const fs=$('floors');fs.innerHTML=Array.from({length:80},(_,i)=>{const n=80-i;return `<div class="floor ${isDone(n)?'completed':isOpen(n)?'unlocked':''} ${n===selected?'selected':''}" data-n="${n}" role="button" tabindex="0" aria-label="第${n}階層"><div class="floor-label"><span>${String(n).padStart(2,'0')}F</span>${isDone(n)?'✓':isOpen(n)?'◇':'🔒'}</div></div>`}).join('');fs.querySelectorAll('.floor').forEach(el=>{el.onclick=()=>choose(+el.dataset.n);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(+el.dataset.n)}}});$('lift').style.top=`${(80-current)*floorHeight+10}px`;$('status').textContent=isOpen(80)?'AI STATUS: ALL FLOORS OPEN':'AI STATUS: MONITORING';$('floorNo').textContent=`FLOOR ${String(selected).padStart(2,'0')} / 80`;$('floorName').textContent=`第${selected}階層 · ${name(selected)}`;$('floorDesc').textContent=isDone(selected)?'インフラ復旧完了。街の機能は正常に戻っています。':isOpen(selected)?selected===1?'被災した第1階層。ここで復旧能力を証明すると、中央AIが他の階層への移動を許可します。':'移動可能。暴走したロボットを鎮静化し、街のインフラを復旧しよう。':'中央AIの許可が必要です。まず第1階層の復旧を完了してください。';$('enter').disabled=!isOpen(selected);$('enter').textContent=isOpen(selected)?'エレベーターで移動 →':'🔒 移動権限なし';center()}function center(){const vp=$('viewport');const viewH=vp.clientHeight||450;const y=(80-selected)*floorHeight+floorHeight/2;const shift=Math.min(0,Math.max(viewH-80*floorHeight,viewH/2-y));$('tower').style.transform=`translateY(${shift}px)`}function choose(n){selected=Math.max(1,Math.min(80,n));draw()}function enter(){if(!isOpen(selected))return notify('まず第1階層を復旧してください');current=selected;draw();$('mapScreen').classList.remove('active');$('stageScreen').classList.add('active');$('stageFloor').textContent=`FLOOR ${String(current).padStart(2,'0')}`;$('stageTitle').textContent=name(current);$('stageInfo').textContent=isDone(current)?'この街は復旧済みです。各ステージの記録を確認できます。':'暴走ロボットの鎮静化と、街のインフラ復旧を進めましょう。';const level=data.levels[current]||1;$('stages').innerHTML=Array.from({length:6},(_,i)=>{const n=i+1;return `<button class="stage ${n<level?'done':''}" data-level="${n}" ${n>level?'disabled':''}>${current}-${n}<small>${n===6?'BOSS':n<level?'✓ CLEAR':n===level?'SELECT':'🔒'}</small></button>`}).join('');$('stages').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=+b.dataset.level;if(n===6)notify('ボス戦は今後実装予定');else{data.levels[current]=Math.max(data.levels[current]||1,n+1);save();notify(`ステージ ${current}-${n} のデモクリア`);enter()}});$('complete').textContent=isDone(current)?'✓ 復旧済み':'デモ：この街の復旧を完了';$('complete').disabled=isDone(current);$('complete').onclick=()=>{if(!isDone(current)){data.completed.push(current);data.levels[current]=7;save();if(current===1)notify('中央AI：復旧協力者に認定。全80階層を解放しました！');else notify(`第${current}階層の復旧完了！`);enter()}}}function back(){$('stageScreen').classList.remove('active');$('mapScreen').classList.add('active');draw()}$('enter').onclick=enter;$('back').onclick=back;$('goFirst').onclick=()=>choose(1);$('up').onclick=()=>choose(selected+1);$('down').onclick=()=>choose(selected-1);$('reset').onclick=()=>{if(confirm('試作品の進行状況をリセットしますか？')){data={completed:[],levels:{}};save();selected=1;current=1;draw();notify('リセットしました')}};let startY=null;$('viewport').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});$('viewport').addEventListener('touchend',e=>{if(startY===null)return;const dy=e.changedTouches[0].clientY-startY;startY=null;if(Math.abs(dy)>35)choose(selected+Math.round(dy/24))},{passive:true});$('viewport').addEventListener('wheel',e=>{e.preventDefault();choose(selected+(e.deltaY<0?1:-1))},{passive:false});window.addEventListener('resize',center);draw()})();
</script></body></html>
